<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rhodium Rewards promotional banner</title>
  <desc id="desc">A promotional banner for Rhodium Rewards featuring a branded card, loyalty highlights, and a call to action.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="30" x2="1120" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07142D" />
      <stop offset="0.55" stop-color="#173784" />
      <stop offset="1" stop-color="#4F5BFF" />
    </linearGradient>
    <linearGradient id="card" x1="160" y1="110" x2="430" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1E55" />
      <stop offset="1" stop-color="#132D73" />
    </linearGradient>
    <linearGradient id="gold" x1="175" y1="145" x2="375" y2="345" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE08A" />
      <stop offset="1" stop-color="#D4A53E" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="1200" height="500" rx="32" fill="url(#bg)" />
  <circle cx="1040" cy="130" r="175" fill="#FFFFFF" fill-opacity="0.08" />
  <circle cx="1005" cy="390" r="200" fill="#FFFFFF" fill-opacity="0.05" />
  <circle cx="155" cy="405" r="165" fill="#FFFFFF" fill-opacity="0.05" />

  <g filter="url(#shadow)">
    <rect x="90" y="95" width="320" height="310" rx="50" fill="url(#card)" />
    <rect x="125" y="130" width="205" height="205" rx="38" fill="url(#gold)" />
    <circle cx="345" cy="175" r="28" fill="#F6D27B" fill-opacity="0.7" />
    <path d="M175 174H233C278.8 174 312 207.2 312 253C312 298.8 278.8 332 233 332H219V383H175V174ZM219 214V292H233C251.8 292 267 276.8 267 258C267 239.2 251.8 224 233 224H219V214Z" fill="#0B1D4A" />
    <path d="M264 228L325 316H295L252 254L220 316H191L251 228H264Z" fill="#FFF8D8" />
    <rect x="125" y="355" width="225" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.14" />
    <circle cx="149" cy="368" r="7" fill="#FFE08A" />
    <circle cx="177" cy="368" r="7" fill="#FFE08A" fill-opacity="0.72" />
    <circle cx="205" cy="368" r="7" fill="#FFE08A" fill-opacity="0.45" />
  </g>

  <g>
    <text x="455" y="175" fill="#E8EEFF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">EARN. REDEEM. REPEAT.</text>
    <text x="455" y="245" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700">Rhodium Rewards</text>
    <text x="455" y="300" fill="#D8E2FF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">Unlock exclusive offers, track your points, and turn every visit into value.</text>
    <g fill="#DDE6FF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">
      <text x="455" y="355">• Real-time rewards balance</text>
      <text x="455" y="392">• Limited-time perks and seasonal drops</text>
      <text x="455" y="429">• Fast redemption with a single tap</text>
    </g>
    <rect x="900" y="338" width="210" height="64" rx="32" fill="#FFE08A" />
    <text x="952" y="379" fill="#122040" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Join now</text>
  </g>
</svg>
